<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="重點整理">
<title>影片重點整理 · YT Recap</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0A0F1C;
    --bg-elev: #0F172A;
    --surface: #111A2E;
    --surface-hover: #16213A;
    --border: #1E2A44;
    --border-strong: #2A3A5C;
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --accent: #38BDF8;
    --accent-glow: rgba(56, 189, 248, 0.32);
    --accent-bg: rgba(56, 189, 248, 0.10);
    --accent-border: rgba(56, 189, 248, 0.26);
    --accent-strong: #0EA5E9;
    --green: #22C55E;
    --amber: #F59E0B;

    --radius: 14px;
    --radius-sm: 8px;
    --transition: 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0; min-height: 100dvh;
    font-family: var(--font-sans); color: var(--text); background-color: var(--bg);
    background-image:
      linear-gradient(to right, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148, 163, 184, 0.04) 1px, transparent 1px),
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.10), transparent),
      radial-gradient(ellipse 60% 50% at 85% 115%, rgba(34, 197, 94, 0.05), transparent);
    background-size: 64px 64px, 64px 64px, 100% 100%, 100% 100%;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    line-height: 1.5; letter-spacing: -0.005em; overscroll-behavior-y: contain;
  }
  .shell { width: 100%; max-width: 860px; margin: 0 auto; padding: 24px 20px 64px; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .mark { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #05121C; display: grid; place-items: center; box-shadow: 0 0 30px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.25); }
  .mark svg { width: 24px; height: 24px; }
  .brand .eyebrow { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--accent); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 3px; }
  .brand h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; flex-shrink: 0; border-radius: 11px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-hover); }
  .icon-btn svg { width: 20px; height: 20px; stroke-width: 1.9; }

  .back-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 18px; transition: var(--transition); }
  .back-link:hover { color: var(--accent); }
  .back-link svg { width: 14px; height: 14px; stroke-width: 2; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .panel-label { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
  .panel-label::before { content: ""; width: 6px; height: 6px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

  label.field { display: block; margin-bottom: 14px; }
  label.field:last-child { margin-bottom: 0; }
  .field-name { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 7px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .field-name .hint { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); font-weight: 400; }

  input[type="text"], input[type="password"], input[type="url"], select {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong);
    background: var(--bg-elev); color: var(--text); font-family: var(--font-sans); font-size: 15px;
    transition: var(--transition); -webkit-appearance: none; appearance: none;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6l4 4 4-4'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 38px; }
  .input-mono { font-family: var(--font-mono); font-size: 13px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* Segmented engine toggle */
  .seg { display: flex; gap: 4px; padding: 4px; background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: 10px; margin-bottom: 14px; }
  .seg button { flex: 1; padding: 9px 10px; border: none; background: transparent; color: var(--text-muted); font-family: var(--font-sans); font-size: 13px; font-weight: 500; border-radius: 7px; cursor: pointer; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
  .seg button.active { background: var(--accent-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-border); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; width: 100%; padding: 14px 18px; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 15px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #05121C; box-shadow: 0 8px 24px var(--accent-glow); transition: var(--transition); -webkit-tap-highlight-color: transparent; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 30px var(--accent-glow); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }
  .btn svg { width: 18px; height: 18px; stroke-width: 2; }
  .btn-ghost { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border-strong); box-shadow: none; padding: 10px 14px; font-size: 13px; font-weight: 500; width: auto; }
  .btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--surface-hover); transform: none; box-shadow: none; }
  .btn-ghost svg { width: 15px; height: 15px; }

  #settings { display: none; }
  #settings.open { display: block; }
  .key-note { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin: 4px 0 0; }
  .key-note a { color: var(--accent); }

  #status { display: none; text-align: center; padding: 34px 20px; }
  #status.show { display: block; }
  .spinner { width: 42px; height: 42px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid var(--border-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status .msg { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; min-height: 22px; }
  #status .timer { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

  .alert { display: none; padding: 13px 15px; border-radius: var(--radius-sm); font-size: 13.5px; line-height: 1.55; margin-bottom: 16px; }
  .alert.show { display: block; }
  .alert.error { background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.3); color: #FCA5A5; }
  .alert .link-btn { color: var(--accent); background: none; border: none; padding: 0; cursor: pointer; font: inherit; text-decoration: underline; }

  /* Result */
  #result { display: none; }
  #result.show { display: block; }
  .result-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .thumb { width: 120px; aspect-ratio: 16/9; border-radius: var(--radius-sm); object-fit: cover; flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-elev); }
  .rh-body { min-width: 0; flex: 1; }
  .result-title { margin: 0 0 6px; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .result-meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; line-height: 1.7; }
  .chip { display: inline-block; font-family: var(--font-mono); font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); margin-right: 6px; }

  .result-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .btn-sum { display: inline-flex; align-items: center; gap: 7px; padding: 10px 15px; border: none; border-radius: var(--radius-sm); font-family: var(--font-sans); font-size: 13px; font-weight: 600; cursor: pointer; color: #05121C; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); box-shadow: 0 6px 18px var(--accent-glow); transition: var(--transition); -webkit-tap-highlight-color: transparent; }
  .btn-sum:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 10px 24px var(--accent-glow); }
  .btn-sum:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  .btn-sum svg { width: 16px; height: 16px; stroke-width: 2; }
  .sum-loading { text-align: center; padding: 22px; color: var(--text-muted); font-size: 13px; }
  .report { margin: 4px 0 16px; padding: 16px; border: 1px solid var(--accent-border); border-radius: var(--radius-sm); background: linear-gradient(180deg, var(--accent-bg), transparent); }
  .report-bar { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 12px; }
  .report-bar .btn-ghost { margin-left: auto; }
  .report-time { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }
  .sum-timer { font-family: var(--font-mono); color: var(--accent); }
  .report-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--accent); }
  .report-title { margin: 2px 0 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .report .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .report .tag-chip { font-family: var(--font-mono); font-size: 10px; padding: 3px 9px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-border); }
  .report .tldr { background: var(--accent-bg); border: 1px solid var(--accent-border); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 14.5px; line-height: 1.6; }
  .report .tldr b { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 5px; }
  .report .sec { margin-bottom: 16px; }
  .report .sec:last-child { margin-bottom: 0; }
  .report .sec-title { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .report .kp { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
  .report .kp-dot { flex-shrink: 0; width: 6px; height: 6px; margin-top: 8px; border-radius: 2px; background: var(--accent); }
  .report .kp:last-child { border-bottom: none; }
  .report .kp-text { font-size: 14px; line-height: 1.6; }
  .report .chapter { padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; line-height: 1.6; }
  .report .chapter:last-child { border-bottom: none; }
  .report .chapter p { margin: 4px 0 0; color: var(--text-muted); }
  .report .term { padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 14px; line-height: 1.6; }
  .report .term:last-child { border-bottom: none; }
  .report .term b { color: var(--accent); }
  .report ul.actions { margin: 0; padding: 0; list-style: none; }
  .report ul.actions li { position: relative; padding: 7px 0 7px 22px; font-size: 14px; line-height: 1.55; border-bottom: 1px dashed var(--border); }
  .report ul.actions li:last-child { border-bottom: none; }
  .report ul.actions li::before { content: ""; position: absolute; left: 3px; top: 14px; width: 7px; height: 7px; border-radius: 2px; background: var(--green); }
  .report .conclusion { font-size: 14px; line-height: 1.7; color: var(--text-muted); }
  .report .overview { font-size: 14.5px; line-height: 1.7; }
  .report .diagram { display: flex; justify-content: center; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-elev); overflow-x: auto; }
  .report .diagram svg { max-width: 100%; height: auto; }
  .report .diagram-loading { color: var(--text-muted); font-size: 12px; text-align: center; padding: 18px; }
  .tx-details { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-elev); }
  .tx-summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; color: var(--text-muted); -webkit-tap-highlight-color: transparent; }
  .tx-summary::-webkit-details-marker { display: none; }
  .tx-summary:hover { color: var(--text); }
  .tx-summary .chev { width: 16px; height: 16px; flex-shrink: 0; transition: transform .2s; }
  .tx-details[open] .tx-summary .chev { transform: rotate(180deg); }
  .tx-body { padding: 0 12px 12px; }
  .tx-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .tx-details .transcript { max-height: 440px; }

  .view-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .view-bar .seg { margin-bottom: 0; flex-shrink: 0; }
  .view-bar .seg button { padding: 7px 12px; font-size: 12px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--text-dim); pointer-events: none; }
  #search { padding: 9px 12px 9px 33px; font-size: 13px; }

  .transcript { max-height: 560px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 4px; background: var(--bg-elev); }
  .transcript::-webkit-scrollbar { width: 10px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; border: 3px solid var(--bg-elev); }

  .seg-row { display: flex; gap: 12px; padding: 8px 12px; border-radius: 6px; transition: background 120ms; }
  .seg-row:hover { background: var(--surface); }
  .seg-row.hidden { display: none; }
  a.ts { flex-shrink: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--accent); text-decoration: none; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--accent-border); background: var(--accent-bg); height: fit-content; white-space: nowrap; transition: var(--transition); }
  a.ts:hover { background: var(--accent); color: #05121C; }
  .seg-text { font-size: 14.5px; line-height: 1.65; color: var(--text); }
  .seg-text mark { background: rgba(245, 158, 11, 0.3); color: var(--text); border-radius: 3px; padding: 0 2px; }
  .plain-view .ts { display: none; }
  .plain-view .seg-row { padding: 4px 12px; }

  .empty { text-align: center; padding: 26px 16px; color: var(--text-dim); font-size: 13px; }
  .empty svg { width: 30px; height: 30px; stroke-width: 1.5; opacity: 0.5; margin-bottom: 8px; }

  /* History */
  .hist-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .hist-item { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elev); margin-bottom: 8px; cursor: pointer; transition: var(--transition); }
  .hist-item:hover { border-color: var(--accent-border); background: var(--surface-hover); }
  .hist-thumb { width: 76px; aspect-ratio: 16/9; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--surface); }
  .hist-body { min-width: 0; flex: 1; }
  .hist-body h5 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .hist-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.03em; }
  .hist-del { flex-shrink: 0; border: none; background: none; color: var(--text-dim); cursor: pointer; padding: 6px; border-radius: 6px; transition: var(--transition); }
  .hist-del:hover { color: var(--accent); background: var(--accent-bg); }
  .hist-del svg { width: 16px; height: 16px; stroke-width: 2; display: block; }

  .footnote { margin-top: 26px; padding: 13px 18px; background: rgba(17,26,46,0.5); border: 1px solid rgba(148,163,184,0.14); border-radius: 999px; color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); letter-spacing: 0.02em; line-height: 1.5; display: flex; align-items: center; gap: 10px; }
  .footnote svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--accent); stroke-width: 1.8; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--bg-elev); border: 1px solid var(--border-strong); color: var(--text); padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: var(--transition); z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .shell { padding: 18px 14px 48px; }
    .result-head { flex-direction: column; }
    .thumb { width: 100%; }
    .row { flex-direction: column; }
    .view-bar { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<main class="shell">

  <a class="back-link" href="../toolbox-pwa/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回工具箱
  </a>

  <header class="topbar">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
          <path d="M4 6h16"/><path d="M4 10h16"/><path d="M4 14h10"/><path d="M4 18h13"/>
        </svg>
      </div>
      <div>
        <div class="eyebrow">// YT Recap</div>
        <h1>影片重點整理</h1>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定" title="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- Settings -->
  <section class="panel" id="settings">
    <div class="panel-label">設定</div>
    <label class="field">
      <span class="field-name">字幕來源 API <span class="hint">原始字幕引擎，可自訂</span></span>
      <input type="text" id="captionApi" class="input-mono" placeholder="https://youtube-transcript.ai" spellcheck="false">
    </label>
    <label class="field">
      <span class="field-name">Gemini API 金鑰 <span class="hint">AI 轉錄用，存在本機</span></span>
      <input type="password" id="apiKey" class="input-mono" placeholder="貼上你的 Gemini API key" autocomplete="off" spellcheck="false">
    </label>
    <label class="field">
      <span class="field-name">Gemini 模型</span>
      <input type="text" id="model" class="input-mono" list="modelList" placeholder="gemini-3.6-flash" spellcheck="false">
      <datalist id="modelList">
        <option value="gemini-3.6-flash">快速、免費額度高（建議）</option>
        <option value="gemini-3.7-flash">最新</option>
        <option value="gemini-3.5-flash-lite">最省最快</option>
      </datalist>
    </label>
    <p class="key-note">
      「原始字幕」直接向字幕來源 API 取回 YouTube 既有字幕，免金鑰。「AI 轉錄」由 Gemini 直接聽影片產生，適合沒有字幕的影片；金鑰只存在本機、直接送往 Google。
      免費申請 Gemini 金鑰：<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>。
    </p>
    <div style="margin-top:14px;"><button class="btn btn-ghost" id="saveSettings" style="width:100%;">儲存設定</button></div>
  </section>

  <div class="alert" id="alert"></div>

  <!-- Input -->
  <section class="panel">
    <div class="panel-label">影片重點整理</div>
    <label class="field">
      <span class="field-name">YouTube 網址</span>
      <input type="url" id="url" class="input-mono" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false" autocomplete="off">
    </label>
    <div class="row" style="margin-bottom:14px;">
      <label class="field" style="margin-bottom:0;">
        <span class="field-name">輸出語言</span>
        <select id="lang">
          <option value="">自動（依影片）</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="zh-Hans">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <label class="field" style="margin-bottom:0;">
        <span class="field-name">字幕來源 <span class="hint" id="langHint">沒字幕改 AI 轉錄</span></span>
        <select id="engineSel">
          <option value="original">原始字幕 · 免金鑰</option>
          <option value="gemini">AI 轉錄 · Gemini</option>
        </select>
      </label>
    </div>
    <button class="btn" id="recapBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5 10.1 7.6z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      一鍵重點整理
    </button>
    <button class="btn btn-ghost" id="grabBtn" style="width:100%; margin-top:8px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h8"/></svg>
      只擷取逐字稿（不整理）
    </button>
  </section>

  <!-- Loading -->
  <section id="status">
    <div class="spinner"></div>
    <div class="msg" id="statusMsg">讀取影片內容中…</div>
    <div class="timer" id="statusTimer">00:00</div>
  </section>

  <!-- Result -->
  <section class="panel" id="result"></section>

  <!-- History -->
  <section class="panel">
    <div class="panel-label">歷史記錄</div>
    <div class="hist-toolbar">
      <button class="btn-ghost" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>匯出 JSON</button>
      <button class="btn-ghost" id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg>匯入</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div id="historyList"></div>
  </section>

  <div class="footnote">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    <span>只處理有字幕的影片；沒有字幕會顯示「未提供字幕」</span>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const LS = { captionApi: "yt.captionApi", key: "yt.apiKey", model: "yt.model", engine: "yt.engine", lang: "yt.lang", history: "yt.history" };
  const DEFAULT_API = "https://youtube-transcript.ai";

  const DEFAULT_MODEL = "gemini-3.6-flash";
  // Restore (falling back to the recap tool's stored key/model if present)
  $("captionApi").value = localStorage.getItem(LS.captionApi) || DEFAULT_API;
  $("apiKey").value = localStorage.getItem(LS.key) || localStorage.getItem("vr.apiKey") || "";
  // Migrate the retired gemini-2.5-flash to the current default
  let storedModel = localStorage.getItem(LS.model) || localStorage.getItem("vr.model") || DEFAULT_MODEL;
  if (storedModel === "gemini-2.5-flash" || storedModel === "gemini-2.0-flash") storedModel = DEFAULT_MODEL;
  $("model").value = storedModel;
  localStorage.setItem(LS.model, storedModel);
  let engine = localStorage.getItem(LS.engine) || "original";
  $("lang").value = localStorage.getItem(LS.lang) || "";
  let currentView = "timestamp";
  let currentRecord = null;

  // Toast / alert
  let toastTimer;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2200); }
  function showAlert(html) { const a = $("alert"); a.innerHTML = html; a.className = "alert show error"; }
  function clearAlert() { $("alert").className = "alert"; }

  // Settings
  $("settingsBtn").addEventListener("click", () => {
    $("settings").classList.toggle("open");
    if ($("settings").classList.contains("open")) $("settings").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("saveSettings").addEventListener("click", () => {
    localStorage.setItem(LS.captionApi, ($("captionApi").value.trim() || DEFAULT_API).replace(/\/+$/, ""));
    localStorage.setItem(LS.key, $("apiKey").value.trim());
    localStorage.setItem(LS.model, ($("model").value.trim() || DEFAULT_MODEL));
    $("settings").classList.remove("open");
    toast("設定已儲存");
  });

  // Engine (subtitle source) select
  $("engineSel").value = engine;
  $("langHint").textContent = engine === "gemini" ? "Gemini 直接聽影片" : "沒字幕改 AI 轉錄";
  $("engineSel").addEventListener("change", (e) => {
    engine = e.target.value;
    localStorage.setItem(LS.engine, engine);
    $("langHint").textContent = engine === "gemini" ? "Gemini 直接聽影片" : "沒字幕改 AI 轉錄";
  });
  $("lang").addEventListener("change", (e) => localStorage.setItem(LS.lang, e.target.value));

  // Helpers
  function extractVideoId(input) {
    if (!input) return null;
    const s = input.trim();
    const pats = [/(?:youtube\.com\/watch\?(?:.*&)?v=)([\w-]{11})/, /(?:youtu\.be\/)([\w-]{11})/, /(?:youtube\.com\/(?:embed|shorts|live|v)\/)([\w-]{11})/];
    for (const p of pats) { const m = s.match(p); if (m) return m[1]; }
    if (/^[\w-]{11}$/.test(s)) return s;
    return null;
  }
  const thumbUrl = (id) => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  function fmtTs(sec) { sec = Math.floor(sec); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
  function tsToSeconds(ts) { const p = ts.split(":").map((n) => parseInt(n, 10)); if (p.some(isNaN)) return null; if (p.length === 3) return p[0]*3600+p[1]*60+p[2]; if (p.length === 2) return p[0]*60+p[1]; return p[0]; }

  // Parse "[m:ss] text" style body → {title, meta, segments:[{start,text}]}
  function parseBody(text) {
    const lines = text.split(/\r?\n/);
    let title = "", meta = { lang: "", duration: "", words: "" };
    const segments = [];
    const tsRe = /^\[(\d{1,2}:\d{2}(?::\d{2})?)\]\s?(.*)$/;
    let cur = null;
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (!title && /^#\s*Transcript:\s*/i.test(line)) { title = line.replace(/^#\s*Transcript:\s*/i, "").trim(); continue; }
      const mLang = line.match(/Language:\s*([\w-]+)\s*·\s*Duration:\s*([\d:]+)\s*·\s*Words:\s*([\d,]+)/i);
      if (mLang) { meta.lang = mLang[1]; meta.duration = mLang[2]; meta.words = mLang[3]; continue; }
      const m = line.match(tsRe);
      if (m) { cur = { start: tsToSeconds(m[1]), text: m[2] || "" }; segments.push(cur); }
      else if (cur && line.trim()) { cur.text += (cur.text ? " " : "") + line.trim(); }
    }
    // Fallback: no timestamps at all → treat non-empty lines as one blob
    if (!segments.length) {
      const blob = lines.filter((l) => l.trim() && !/^#/.test(l) && !/^Source video:/i.test(l) && !/^Language:/i.test(l) && !/^Other available/i.test(l) && !/^To request/i.test(l)).join(" ").trim();
      if (blob) segments.push({ start: null, text: blob });
    }
    return { title, meta, segments };
  }

  // Loading
  let timerInt, msgInt, startTs;
  const msgs = { original: ["讀取影片字幕中…", "解析字幕軌…", "準備整理…"], gemini: ["上傳影片給 Gemini…", "聆聽並轉錄中…", "準備整理…", "快好了…"] };
  function startLoading(eng) {
    $("status").classList.add("show"); $("result").classList.remove("show"); startTs = Date.now();
    const list = msgs[eng] || msgs.original; let i = 0; $("statusMsg").textContent = list[0];
    timerInt = setInterval(() => { const s = Math.floor((Date.now()-startTs)/1000); $("statusTimer").textContent = `${pad(Math.floor(s/60))}:${pad(s%60)}`; }, 500);
    msgInt = setInterval(() => { i = (i+1)%list.length; $("statusMsg").textContent = list[i]; }, 3500);
  }
  function stopLoading() { clearInterval(timerInt); clearInterval(msgInt); $("status").classList.remove("show"); }

  // Engines
  async function fetchOriginal(videoId, lang) {
    const base = (localStorage.getItem(LS.captionApi) || DEFAULT_API).replace(/\/+$/, "");
    const url = `${base}/transcript/${videoId}.txt` + (lang ? `?lang=${encodeURIComponent(lang)}` : "");
    let res;
    try { res = await fetch(url, { headers: { "Accept": "text/plain" } }); }
    catch (_) { throw new Error("連不到字幕服務，可能服務暫時中斷，或到設定換一個字幕來源 API。"); }
    const body = await res.text();
    if (!res.ok) {
      if (res.status === 404) throw new Error("未提供字幕");
      throw new Error(`字幕服務回應 ${res.status}，稍後再試。`);
    }
    // Some caption services return HTTP 200 with a "no captions" notice instead of a 404.
    if (/^#\s*No captions available/i.test(body) || /no auto-generated captions/i.test(body) || /transcript cannot be extracted/i.test(body)) {
      throw new Error("未提供字幕");
    }
    const parsed = parseBody(body);
    if (!parsed.segments.length) throw new Error("未提供字幕");
    // If parsing collapsed everything into a single short blob, the body was likely a notice, not a transcript.
    if (parsed.segments.length === 1 && parsed.segments[0].start == null && parsed.segments[0].text.length < 400) {
      throw new Error("未提供字幕");
    }
    return parsed;
  }

  async function fetchGemini(videoId, lang) {
    const apiKey = ($("apiKey").value || localStorage.getItem(LS.key) || "").trim();
    const model = ($("model").value.trim() || DEFAULT_MODEL);
    if (!apiKey) { const e = new Error("AI 轉錄需要 Gemini 金鑰，請先到設定填入。"); e.openSettings = true; throw e; }
    localStorage.setItem(LS.key, apiKey); localStorage.setItem(LS.model, model);
    const L = lang ? langName(lang) : "影片原本的語言";
    const prompt = `請將這支 YouTube 影片完整逐字轉錄成逐字稿，語言使用「${L}」。
規則：
- 依語意或大約每 10–15 秒切成一段，每段句首標上該段開始的時間戳，格式 [M:SS] 或 [H:MM:SS]（使用影片實際時間）。
- 忠實轉錄口說內容，不要摘要、不要改寫、不要加註解。
- 第一行可選擇性輸出「# Transcript: 影片標題」，其餘只輸出逐字稿本文，不要任何額外說明或 markdown 標記。`;
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
        body: JSON.stringify({
          contents: [{ parts: [ { fileData: { fileUri: `https://www.youtube.com/watch?v=${videoId}`, mimeType: "video/*" } }, { text: prompt } ] }],
          generationConfig: { temperature: 0.2 }
        })
      });
    } catch (_) { throw new Error("連不到 Gemini，請檢查網路。"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const em = (data.error && data.error.message) || `HTTP ${res.status}`; throw new Error(friendlyGemini(res.status, em)); }
    if (data.promptFeedback && data.promptFeedback.blockReason) throw new Error("這支影片被 Gemini 擋下了（可能私人、年齡限制或內容因素）。");
    const cand = data.candidates && data.candidates[0];
    const text = cand && cand.content && cand.content.parts && cand.content.parts.map((p) => p.text || "").join("");
    if (!text) throw new Error("Gemini 沒有回傳內容，影片可能太長或暫時無法讀取。");
    const parsed = parseBody(text);
    if (!parsed.segments.length) throw new Error("轉錄結果無法解析，請再試一次。");
    if (cand.finishReason === "MAX_TOKENS") parsed.truncated = true;
    return parsed;
  }
  function langName(code) { return ({ "zh-Hant":"繁體中文","zh-Hans":"简体中文","en":"English","ja":"日本語","ko":"한국어" })[code] || code; }
  function friendlyGemini(status, msg) {
    if (status === 400 && /API key not valid/i.test(msg)) return "Gemini 金鑰無效，請到設定確認。";
    if (status === 403) return "金鑰沒有權限或未啟用 Gemini API。";
    if (status === 429) return "已達 Gemini 免費額度上限，稍後再試。";
    if (status >= 500) return "Google 伺服器暫時有問題，稍後再試。";
    return msg;
  }

  // Main
  function setBusy(b) { ["recapBtn", "grabBtn"].forEach((id) => { const el = $(id); if (el) el.disabled = b; }); }

  // grab(autoSummarize): fetch transcript; if autoSummarize, also generate the recap report.
  async function grab(autoSummarize) {
    clearAlert();
    const videoId = extractVideoId($("url").value);
    if (!videoId) { showAlert("看不懂這個 YouTube 網址，請確認後再試。"); return; }
    // For the recap flow, a Gemini key is required up front.
    if (autoSummarize) {
      const k = ($("apiKey").value || localStorage.getItem(LS.key) || "").trim();
      if (!k) { showAlert("生成重點整理需要 Gemini 金鑰，請先到右上齒輪設定填入。"); $("settings").classList.add("open"); return; }
    }
    const lang = $("lang").value;
    setBusy(true); startLoading(engine);
    try {
      let parsed;
      if (engine === "gemini") parsed = await fetchGemini(videoId, lang);
      else parsed = await fetchOriginal(videoId, lang);

      const record = {
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())),
        videoId, url: `https://www.youtube.com/watch?v=${videoId}`,
        engine, lang, createdAt: new Date().toISOString(),
        title: parsed.title || "", meta: parsed.meta || {}, segments: parsed.segments,
        truncated: !!parsed.truncated
      };
      saveHistory(record);
      renderResult(record);
      renderHistory();
      stopLoading();
      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
      if (autoSummarize) await summarize(record);
    } catch (err) {
      let msg = err.message || String(err);
      let extra = "";
      if (msg.includes("__GEMINI__")) { msg = msg.replace("__GEMINI__", ""); extra = ` <button class="link-btn" id="switchGemini">改用 AI 轉錄</button>`; }
      showAlert(esc(msg.trim()) + extra);
      if (err.openSettings) $("settings").classList.add("open");
      const sg = $("switchGemini");
      if (sg) sg.addEventListener("click", () => {
        engine = "gemini"; localStorage.setItem(LS.engine, engine); $("engineSel").value = "gemini";
        $("langHint").textContent = "Gemini 直接聽影片"; clearAlert(); grab(autoSummarize);
      });
    } finally { stopLoading(); setBusy(false); }
  }

  // Render result
  function renderResult(rec) {
    currentRecord = rec; currentView = "timestamp";
    const segCount = rec.segments.length;
    const words = rec.meta && rec.meta.words ? rec.meta.words : String(plainText(rec).replace(/\s+/g, rec.lang && rec.lang.startsWith("zh") ? "" : " ").length);
    const engineLabel = rec.engine === "gemini" ? "AI 轉錄" : "原始字幕";
    const metaBits = [];
    if (rec.meta && rec.meta.duration) metaBits.push("長度 " + rec.meta.duration);
    metaBits.push(segCount + " 段");
    if (rec.meta && rec.meta.lang) metaBits.push("字幕 " + rec.meta.lang);

    let h = `<div class="result-head">
      <img class="thumb" src="${thumbUrl(rec.videoId)}" alt="" onerror="this.style.display='none'">
      <div class="rh-body">
        <h2 class="result-title">${esc(rec.title || "影片重點")}</h2>
        <div class="result-meta"><span class="chip">${engineLabel}</span>${esc(metaBits.join(" · "))}</div>
      </div>
    </div>`;

    if (rec.truncated) h += `<div class="alert show error" style="margin-bottom:14px;">影片較長，AI 轉錄可能未完整（達輸出上限）。長片建議改用「原始字幕」。</div>`;

    h += `<div class="result-actions">
      <button class="btn-sum" id="summarizeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5 10.1 7.6z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>重點整理</button>
      <a class="btn-ghost" href="${esc(rec.url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>開啟影片</a>
    </div>`;

    // Report first
    h += `<div id="summaryBox"></div>`;

    // Transcript collapsed into a secondary section
    h += `<details class="tx-details">
      <summary class="tx-summary"><span>逐字稿 · ${segCount} 段</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </summary>
      <div class="tx-body">
        <div class="tx-tools">
          <button class="btn-ghost" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>複製</button>
          <button class="btn-ghost" id="dlTxt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>下載 .txt</button>
        </div>
        <div class="view-bar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="text" id="search" class="input-mono" placeholder="搜尋逐字稿…" spellcheck="false" autocomplete="off">
          </div>
        </div>
        <div class="transcript" id="transcript">${renderSegments(rec, "")}</div>
      </div>
    </details>`;

    const el = $("result"); el.innerHTML = h; el.classList.add("show");

    $("summarizeBtn").addEventListener("click", () => summarize(rec));
    renderSummary(rec);
    $("copyBtn").addEventListener("click", () => copyText(rec));
    $("dlTxt").addEventListener("click", () => download(`${safeName(rec)}.txt`, buildTxt(rec), "text/plain"));
    $("search").addEventListener("input", (e) => applySearch(e.target.value));
  }

  function renderSegments(rec, query) {
    return rec.segments.map((s, i) => {
      return `<div class="seg-row" data-i="${i}"><div class="seg-text">${esc(s.text)}</div></div>`;
    }).join("");
  }

  function applySearch(q) {
    q = (q || "").trim().toLowerCase();
    const rows = $("transcript").querySelectorAll(".seg-row");
    rows.forEach((row) => {
      const i = +row.dataset.i;
      const text = currentRecord.segments[i].text;
      const hit = !q || text.toLowerCase().includes(q);
      row.classList.toggle("hidden", !hit);
      const tEl = row.querySelector(".seg-text");
      if (q && hit) {
        const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
        tEl.innerHTML = esc(text).replace(re, "<mark>$1</mark>");
      } else { tEl.textContent = text; }
    });
  }

  // Outputs
  function plainText(rec) { return rec.segments.map((s) => s.text).join("\n"); }
  function buildTxt(rec) {
    let out = (rec.title ? `# ${rec.title}\n` : "") + `${rec.url}\n\n`;
    out += rec.segments.map((s) => s.text).join("\n");
    return out;
  }
  function srtTime(sec) { sec = Math.max(0, sec); const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60); return `${pad(h)}:${pad(m)}:${pad(s)},000`; }
  function buildSrt(rec) {
    const segs = rec.segments.filter((s) => s.start != null);
    if (!segs.length) return rec.segments.map((s) => s.text).join("\n");
    return segs.map((s, i) => {
      const start = s.start, end = (i < segs.length - 1) ? Math.max(start + 1, segs[i+1].start) : start + 4;
      return `${i+1}\n${srtTime(start)} --> ${srtTime(end)}\n${s.text}\n`;
    }).join("\n");
  }
  // ── Gemini 重點整理（吃逐字稿文字，省 token）──
  function safeJson(text) {
    if (!text) return null;
    try { return JSON.parse(text); } catch (_) {}
    const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
    if (m) { try { return JSON.parse(m[1]); } catch (_) {} }
    const s = text.indexOf("{"), e = text.lastIndexOf("}");
    if (s !== -1 && e > s) { try { return JSON.parse(text.slice(s, e + 1)); } catch (_) {} }
    return null;
  }

  async function summarize(rec) {
    const apiKey = ($("apiKey").value || localStorage.getItem(LS.key) || "").trim();
    const model = ($("model").value.trim() || localStorage.getItem(LS.model) || DEFAULT_MODEL);
    const box = $("summaryBox");
    if (!apiKey) { showAlert("生成重點整理需要 Gemini 金鑰，請先到右上齒輪設定填入。"); $("settings").classList.add("open"); return; }
    const btn = $("summarizeBtn"); if (btn) btn.disabled = true;
    box.innerHTML = `<div class="sum-loading"><div class="spinner" style="width:28px;height:28px;margin:0 auto 10px;"></div>Gemini 正在整理重點… <span id="sumTimer" class="sum-timer">0s</span></div>`;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    const t0 = performance.now();
    const timer = setInterval(() => { const el = $("sumTimer"); if (el) el.textContent = ((performance.now() - t0) / 1000).toFixed(0) + "s"; }, 250);
    const L = rec.lang ? langName(rec.lang) : "繁體中文";
    const transcript = rec.segments.map((s) => s.text).join("\n");
    const prompt = `以下是一支 YouTube 影片的逐字稿。請用「${L}」把它統整成一份**結構化重點報告**，目標是讓讀者不看影片也能完整掌握內容、節省時間。請深入歸納脈絡、重點與因果關係，做真正的整理與統整，而不是逐句摘要或簡短概述。
只輸出符合下列結構的 JSON，不要任何額外文字或 markdown 標記：
{
 "title":"影片主題",
 "tldr":"一句話總結（40字內）",
 "topic_tags":["3-5 個主題標籤"],
 "overview":"導讀概述，3-5 句：影片在談什麼、切入角度、以及整體結論",
 "key_points":["關鍵重點，完整且可獨立理解，每點 2-3 句"],
 "chapters":[{"heading":"段落標題","summary":"該段落的重點統整，2-4 句"}],
 "terms":[{"term":"重要名詞","definition":"簡短解釋"}],
 "insights":["值得記住的洞察、結論或可採取的行動，需經過歸納，不要照抄原句"],
 "conclusion":"整體總結，2-4 句",
 "diagram":{"type":"flow","nodes":[{"id":"n1","label":"節點文字（12字內）","emoji":"一個貼切的 emoji 圖示","kind":"root 或 branch"}],"edges":[{"from":"n1","to":"n2","label":"選填關係"}]}
}
要求：
- key_points 至少 6 點；chapters 依內容多寡 3-8 個；皆依內容邏輯順序排列。
- diagram 用 7-11 個節點畫出影片的主題結構或論述流程（中心主題 → 主要面向 → 重點），node id 用 n1、n2…，label 精簡（12 字內），edges 連出邏輯或因果關係。
- diagram 每個節點都要配一個貼切的 emoji 圖示（放在 emoji 欄位，例如影片主題若是手錶就用 ⌚、跑步用 🏃、價格用 💰 等）；中心主題節點的 kind 設為 "root"，其餘設為 "branch"。
- terms、insights 若無可為空陣列；忠於逐字稿、不要杜撰；全部使用「${L}」。

逐字稿：
${transcript}`;
    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.3 } })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(friendlyGemini(res.status, (data.error && data.error.message) || `HTTP ${res.status}`));
      const cand = data.candidates && data.candidates[0];
      const text = cand && cand.content && cand.content.parts && cand.content.parts.map((p) => p.text || "").join("");
      const parsed = safeJson(text);
      if (!parsed) throw new Error("回傳格式無法解析，請再試一次或換個模型。");
      parsed._sec = Math.round(((performance.now() - t0) / 1000) * 10) / 10;
      rec.summary = parsed;
      localStorage.setItem(LS.model, model);
      const arr = getHistory(); const i = arr.findIndex((r) => r.id === rec.id);
      if (i >= 0) { arr[i].summary = parsed; setHistory(arr); renderHistory(); }
      renderSummary(rec);
      $("summaryBox").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (err) {
      box.innerHTML = `<div class="alert show error" style="margin:0;">${esc(err.message || String(err))}</div>`;
    } finally { clearInterval(timer); if (btn) btn.disabled = false; }
  }

  // 示意圖（Mermaid，按需載入）
  let mermaidPromise = null;
  function ensureMermaid() {
    if (window.mermaid) return Promise.resolve(window.mermaid);
    if (mermaidPromise) return mermaidPromise;
    mermaidPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js";
      s.onload = () => {
        try { window.mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "strict", flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" } }); } catch (_) {}
        resolve(window.mermaid);
      };
      s.onerror = () => reject(new Error("mermaid load failed"));
      document.head.appendChild(s);
    });
    return mermaidPromise;
  }
  function buildMermaid(dg) {
    if (!dg || !Array.isArray(dg.nodes) || !dg.nodes.length) return null;
    const cleanId = (s) => String(s || "").replace(/[^A-Za-z0-9_]/g, "").slice(0, 20) || "n";
    const cleanLabel = (s) => String(s || "").replace(/["`|<>]/g, "").replace(/[\[\]{}()]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40) || "…";
    const cleanEmoji = (s) => { s = String(s || "").trim(); try { return /\p{Extended_Pictographic}/u.test(s) ? Array.from(s).find((c) => /\p{Extended_Pictographic}/u.test(c)) || "" : ""; } catch (_) { return ""; } };
    const ids = new Set();
    const roots = [], branches = [];
    const lines = ["graph TD"];
    dg.nodes.forEach((n) => {
      const id = cleanId(n.id); if (!id || ids.has(id)) return; ids.add(id);
      const emo = cleanEmoji(n.emoji);
      const label = (emo ? emo + " " : "") + cleanLabel(n.label);
      lines.push(`  ${id}("${label}")`);
      (String(n.kind || "").toLowerCase() === "root" ? roots : branches).push(id);
    });
    if (ids.size < 2) return null;
    (dg.edges || []).forEach((e) => { const f = cleanId(e && e.from), t = cleanId(e && e.to); if (f && t && ids.has(f) && ids.has(t)) { const lbl = e.label ? `|"${cleanLabel(e.label)}"|` : ""; lines.push(`  ${f} -->${lbl} ${t}`); } });
    lines.push("classDef root fill:#1D4ED8,stroke:#38BDF8,stroke-width:2px,color:#EAF2FF;");
    lines.push("classDef branch fill:#111A2E,stroke:#2A3A5C,color:#F1F5F9;");
    if (roots.length) lines.push("class " + roots.join(",") + " root;");
    if (branches.length) lines.push("class " + branches.join(",") + " branch;");
    return lines.join("\n");
  }
  function renderDiagram(dg) {
    const code = buildMermaid(dg);
    const holder = $("diagramHolder"); if (!holder) return;
    if (!code) { const sec = holder.closest(".sec"); if (sec) sec.remove(); return; }
    ensureMermaid()
      .then((m) => m.render("mmd_" + Date.now().toString(36), code))
      .then(({ svg }) => { const el = $("diagramHolder"); if (el) el.innerHTML = svg; })
      .catch(() => { const el = $("diagramHolder"); const sec = el && el.closest(".sec"); if (sec) sec.remove(); });
  }

  function renderSummary(rec) {
    const box = $("summaryBox"); if (!box) return;
    const d = rec.summary; if (!d) { box.innerHTML = ""; return; }
    let h = `<div class="report"><div class="report-bar"><span class="report-badge">✦ 重點整理</span>${typeof d._sec === "number" ? `<span class="report-time">⏱ 耗時 ${d._sec} 秒</span>` : ""}<button class="btn-ghost" id="copySum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>複製 Markdown</button></div>`;
    if (d.title) h += `<h3 class="report-title">${esc(d.title)}</h3>`;
    if (Array.isArray(d.topic_tags) && d.topic_tags.length) h += `<div class="tags">${d.topic_tags.map((t) => `<span class="tag-chip">${esc(t)}</span>`).join("")}</div>`;
    if (d.tldr) h += `<div class="tldr"><b>一句話總結</b>${esc(d.tldr)}</div>`;
    if (d.overview) h += `<div class="sec"><div class="sec-title">導讀</div><div class="overview">${esc(d.overview)}</div></div>`;
    if (d.diagram && Array.isArray(d.diagram.nodes) && d.diagram.nodes.length) h += `<div class="sec"><div class="sec-title">示意圖</div><div class="diagram" id="diagramHolder"><div class="diagram-loading"><div class="spinner" style="width:20px;height:20px;margin:0 auto 8px;"></div>生成示意圖…</div></div></div>`;
    if (Array.isArray(d.key_points) && d.key_points.length) h += `<div class="sec"><div class="sec-title">重點</div>` + d.key_points.map((k) => `<div class="kp"><span class="kp-dot"></span><div class="kp-text">${esc(typeof k === "string" ? k : (k && k.point) || "")}</div></div>`).join("") + `</div>`;
    if (Array.isArray(d.chapters) && d.chapters.length) h += `<div class="sec"><div class="sec-title">章節</div>` + d.chapters.map((c) => `<div class="chapter"><b>${esc(c.heading)}</b><p>${esc(c.summary)}</p></div>`).join("") + `</div>`;
    if (Array.isArray(d.terms) && d.terms.length) h += `<div class="sec"><div class="sec-title">關鍵名詞</div>` + d.terms.map((t) => `<div class="term"><b>${esc(t.term)}</b>　${esc(t.definition)}</div>`).join("") + `</div>`;
    const acts = (Array.isArray(d.insights) && d.insights.length) ? d.insights : (Array.isArray(d.action_items) ? d.action_items : []);
    if (acts.length) h += `<div class="sec"><div class="sec-title">洞察 / 重點結論</div><ul class="actions">` + acts.map((a) => `<li>${esc(a)}</li>`).join("") + `</ul></div>`;
    if (d.conclusion) h += `<div class="sec"><div class="sec-title">總結</div><div class="conclusion">${esc(d.conclusion)}</div></div>`;
    h += `</div>`;
    box.innerHTML = h;
    if (d.diagram && Array.isArray(d.diagram.nodes) && d.diagram.nodes.length) renderDiagram(d.diagram);
    const cs = $("copySum"); if (cs) cs.addEventListener("click", () => copySummaryMd(rec));
  }

  function copySummaryMd(rec) {
    const d = rec.summary; if (!d) return;
    let m = `# ${d.title || "重點整理"}\n\n> ${rec.url}\n\n`;
    if (d.tldr) m += `**TL;DR：** ${d.tldr}\n\n`;
    if (d.topic_tags && d.topic_tags.length) m += d.topic_tags.map((t) => `\`${t}\``).join(" ") + "\n\n";
    if (d.overview) m += `## 導讀\n\n${d.overview}\n\n`;
    const dgCode = buildMermaid(d.diagram);
    if (dgCode) m += `## 示意圖\n\n\`\`\`mermaid\n${dgCode}\n\`\`\`\n\n`;
    if (d.key_points && d.key_points.length) { m += `## 重點\n\n`; d.key_points.forEach((k) => { m += `- ${typeof k === "string" ? k : (k && k.point) || ""}\n`; }); m += "\n"; }
    if (d.chapters && d.chapters.length) { m += `## 章節\n\n`; d.chapters.forEach((c) => { m += `### ${c.heading}\n${c.summary}\n\n`; }); }
    if (d.terms && d.terms.length) { m += `## 關鍵名詞\n\n`; d.terms.forEach((t) => { m += `- **${t.term}**：${t.definition}\n`; }); m += "\n"; }
    const acts = (Array.isArray(d.insights) && d.insights.length) ? d.insights : (Array.isArray(d.action_items) ? d.action_items : []);
    if (acts.length) { m += `## 洞察 / 重點結論\n\n`; acts.forEach((a) => { m += `- ${a}\n`; }); m += "\n"; }
    if (d.conclusion) m += `## 總結\n\n${d.conclusion}\n`;
    navigator.clipboard.writeText(m).then(() => toast("已複製重點整理"), () => toast("複製失敗"));
  }

  function copyText(rec) {
    navigator.clipboard.writeText(plainText(rec)).then(() => toast("已複製逐字稿"), () => toast("複製失敗"));
  }
  function safeName(rec) { return (rec.title || "transcript").replace(/[\\/:*?"<>|]+/g, "_").slice(0, 60) || "transcript"; }
  function download(name, content, type) {
    const blob = new Blob([content], { type: type + ";charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
    toast("已下載 " + name);
  }

  // History
  function getHistory() { try { return JSON.parse(localStorage.getItem(LS.history) || "[]"); } catch (_) { return []; } }
  function setHistory(a) { try { localStorage.setItem(LS.history, JSON.stringify(a)); } catch (_) { toast("儲存空間已滿，請匯出後清理"); } }
  function saveHistory(rec) { const a = getHistory(); a.unshift(rec); setHistory(a.slice(0, 100)); }
  function renderHistory() {
    const a = getHistory(); const el = $("historyList");
    if (!a.length) { el.innerHTML = `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg><div>還沒有擷取記錄</div></div>`; return; }
    el.innerHTML = a.map((r) => {
      const t = r.title || "逐字稿";
      const meta = new Date(r.createdAt).toLocaleDateString("zh-TW") + " · " + (r.summary ? "✦ 已整理" : (r.engine === "gemini" ? "AI 轉錄" : "逐字稿")) + " · " + (r.segments ? r.segments.length + " 段" : "");
      return `<div class="hist-item" data-id="${esc(r.id)}">
        <img class="hist-thumb" src="${thumbUrl(r.videoId)}" alt="" onerror="this.style.visibility='hidden'">
        <div class="hist-body"><h5>${esc(t)}</h5><div class="hist-meta">${esc(meta)}</div></div>
        <button class="hist-del" data-del="${esc(r.id)}" aria-label="刪除" title="刪除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>`;
    }).join("");
    el.querySelectorAll(".hist-item").forEach((it) => it.addEventListener("click", (e) => {
      if (e.target.closest(".hist-del")) return;
      const rec = getHistory().find((r) => r.id === it.dataset.id);
      if (rec) { renderResult(rec); $("result").scrollIntoView({ behavior: "smooth", block: "start" }); }
    }));
    el.querySelectorAll(".hist-del").forEach((b) => b.addEventListener("click", (e) => {
      e.stopPropagation(); setHistory(getHistory().filter((r) => r.id !== b.dataset.del)); renderHistory(); toast("已刪除");
    }));
  }

  // Export / import
  $("exportBtn").addEventListener("click", () => {
    const a = getHistory(); if (!a.length) { toast("沒有記錄可匯出"); return; }
    download(`yt-transcript-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(a, null, 2), "application/json");
  });
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const imp = JSON.parse(r.result); if (!Array.isArray(imp)) throw new Error();
        const ex = getHistory(); const ids = new Set(ex.map((x) => x.id));
        const merged = ex.concat(imp.filter((x) => x && x.id && !ids.has(x.id)));
        merged.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        setHistory(merged.slice(0, 100)); renderHistory(); toast("已匯入，共 " + getHistory().length + " 筆");
      } catch (_) { toast("檔案格式不正確"); }
    };
    r.readAsText(f); e.target.value = "";
  });

  // Bind
  $("recapBtn").addEventListener("click", () => grab(true));
  $("grabBtn").addEventListener("click", () => grab(false));
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") grab(true); });
  renderHistory();

  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
})();
</script>
</body>
</html>
